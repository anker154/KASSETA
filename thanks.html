<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Спасибо за заявку</title>
  <style>
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#08111b;
      color:#fff;
      display:flex;
      min-height:100vh;
      align-items:center;
      justify-content:center;
      padding:20px;
      text-align:center;
    }
    .box{
      max-width:560px;
      background:#111827;
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:36px 28px;
    }
    h1{margin:0 0 14px;font-size:32px}
    p{margin:0 0 22px;color:#cbd5e1;line-height:1.6}
    a{
      display:inline-block;
      padding:12px 20px;
      background:#22c55e;
      color:#052e16;
      text-decoration:none;
      border-radius:12px;
      font-weight:700;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Спасибо!</h1>
    <p>Ваша заявка отправлена. Мы свяжемся с вами в ближайшее время.</p>
    <a href="/">Вернуться на сайт</a>
  </div>
</body>
</html>
